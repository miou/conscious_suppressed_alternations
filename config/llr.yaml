# Parameters file

# Filepaths (relative to the repository root, where scripts are run)
paths:
  script_dir: 'python/scripts/llr'
  fs_script_dir: 'python/scripts/fs_rivalry'
  data_dir: 'data/preprocessed'
  extract_data_dir: 'data/llr/extract_data'
  pred_all_units_dir: 'data/llr/pred_all_units'
  pred_random_stim_dir: 'data/llr/pred_random_stim'
  pred_unit_subset_dir: 'data/llr/pred_unit_subset'
  pred_shuffle_dir: 'data/llr/pred_shuffle'
  probe_coherence_dir: 'data/llr/probe_coherence'
  fso_decoding_dir: 'data/llr/fso_decoding'
  acorr_dir: 'data/llr/acorr'
  states_loglik_dir: 'data/llr/states_loglik'
  marg_loglik_dir: 'data/llr/marg_loglik'
  stats_dir: 'data/llr/stats'
  summary_stats_dir: 'data/llr/summary_stats'
  compile_data_dir: 'data/llr/compile_data'

# Data parameters
extract_data:
  select_repeat_stimuli: false 

# Parameters for state prediction
model:
  win_size: 10
  r_floor: 0.00000001
  r_start: 100
  r_stop: 1000

# Random stimulus control analysis parameters
pred_random_stim:
  rng_seed: 20260730

# Subset of units control analysis parameters
pred_unit_subset:
  rng_seed: 20260731
  frac_units_hmm: 0.5

# Spike-shuffle control analysis parameters
pred_shuffle:
  rng_seed: 19961002
  win_start: 290
  win_stop: 1010

# Probe coherence parameters
probe_coherence:
  t_start: 300
  t_stop: 1000
  lag: 40

# FSO decoding parameters
fso_decoding:
  win_start: 300
  win_stop: 1000
  max_iter: 10000
  n_folds_cv: 4
  rng_seed_cv: 999
  min_win_frac: 0.25

# Autocorrelation parameters
acorr:
  t_start: 300
  t_stop: 1000
  max_lag: 500

# Summary statistics calculation parameters
stats:
  priming_acc_t_start: 100

# State sequence log-likelihood parameters
states_loglik:
  rng_seed: 20120519
  frac_units_model: 0.5
  bin_size: 5
  win_start: 300
  win_stop: 1000
  mix_alpha_red: 0.6  # 0.625 # 0.65
       # 0.675 # 0.7 # 0.725 # 0.75 # 0.775 # 0.8  # 0.825 # 0.85 # 0.875,
       # 0.9  # 0.925 # 0.95 # 0.975 # 1.0

# Model marginal log-likelihood parameters
marg_loglik:
  cval_seed: 20120519
  shuffle_seed: 19961002
  bin_size: 5
  win_start: 300
  win_stop: 1000
