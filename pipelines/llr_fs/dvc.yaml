# DVC pipeline for log-likelihood ratio (LLR) model

vars:
  - ../recording_lists/fs_rivalry.yaml

stages:

  extract_data:
    foreach: ${rec_all}
    do:
      desc: "Extract data for LLR pipeline"
      cmd: python ${paths.fs_script_dir}/extract_data.py --session ${item.session} --paradigm ${item.paradigm} --probes ${item.probes}
      deps:
        - ${paths.fs_script_dir}/extract_data.py
        - ${paths.data_dir}/${item.session}/session.h5
      params:
        - extract_data
      outs:
        - ${paths.extract_data_dir}/${item.session}_${item.paradigm}_${item.probes}.joblib

  pred_unit_subset:
    foreach: ${rec_all}
    do:
      desc: "Compute LLR and predict states using randomly selected subset of units"
      cmd: python ${paths.script_dir}/pred_unit_subset.py --session ${item.session} --paradigm ${item.paradigm} --probes ${item.probes}
      deps:
        - ${paths.script_dir}/pred_unit_subset.py
        - ${paths.extract_data_dir}/${item.session}_${item.paradigm}_${item.probes}.joblib
      params:
        - model
        - pred_unit_subset
      outs:
        - ${paths.pred_unit_subset_dir}/${item.session}_${item.paradigm}_${item.probes}.joblib

  pred_all_units:
    foreach: ${rec_all}
    do:
      desc: "Compute LLR and predict states using all units in recording"
      cmd: python ${paths.script_dir}/pred_all_units.py --session ${item.session} --paradigm ${item.paradigm} --probes ${item.probes}
      deps:
        - ${paths.script_dir}/pred_all_units.py
        - ${paths.extract_data_dir}/${item.session}_${item.paradigm}_${item.probes}.joblib
      params:
        - model
      outs:
        - ${paths.pred_all_units_dir}/${item.session}_${item.paradigm}_${item.probes}.joblib

  pred_random_stim:
    foreach: ${rec_all}
    do:
      desc: "Compute LLR and predict states with randomly selected stimuli as control"
      cmd: python ${paths.script_dir}/pred_random_stim.py --session ${item.session} --paradigm ${item.paradigm} --probes ${item.probes}
      deps:
        - ${paths.script_dir}/pred_random_stim.py
        - ${paths.extract_data_dir}/${item.session}_${item.paradigm}_${item.probes}.joblib
      params:
        - model
        - pred_random_stim
      outs:
        - ${paths.pred_random_stim_dir}/${item.session}_${item.paradigm}_${item.probes}.joblib

  pred_shuffle:
    foreach: ${rec_all}
    do:
      desc: "Compute LLR and predict states with shuffled spikes as control"
      cmd: python ${paths.script_dir}/pred_shuffle.py --session ${item.session} --paradigm ${item.paradigm} --probes ${item.probes}
      deps:
        - ${paths.script_dir}/pred_shuffle.py
        - ${paths.extract_data_dir}/${item.session}_${item.paradigm}_${item.probes}.joblib
      params:
        - model
        - pred_shuffle
      outs:
        - ${paths.pred_shuffle_dir}/${item.session}_${item.paradigm}_${item.probes}.joblib

  probe_coherence:
    foreach: ${rec_ml_am}
    do:
      desc: "Compute state overlap on LLR models fit to probes in ML and AM regions"
      cmd: python ${paths.fs_script_dir}/probe_coherence.py --session ${item.session} --paradigm ${item.paradigm} --probes ${item.probes}
      deps:
        - ${paths.fs_script_dir}/probe_coherence.py
        - ${paths.extract_data_dir}/${item.session}_${item.paradigm}_${item.probes}.joblib # Only listing file with both probes, but depends on individual ones too
        - ${paths.pred_all_units_dir}/${item.session}_${item.paradigm}_${item.probes}.joblib # Same here
      params:
        - probe_coherence
      outs:
        - ${paths.probe_coherence_dir}/${item.session}_${item.paradigm}_${item.probes}.json

  fso_decoding:
    foreach: ${rec_fso}
    do:
      desc: "State-specific SVM decoding accuracy on FSO sessions"
      cmd: python ${paths.fs_script_dir}/fso_decoding.py --session ${item.session} --paradigm ${item.paradigm} --probes ${item.probes}
      deps:
        - ${paths.fs_script_dir}/fso_decoding.py
        - ${paths.extract_data_dir}/${item.session}_${item.paradigm}_${item.probes}.joblib
        - ${paths.pred_all_units_dir}/${item.session}_${item.paradigm}_${item.probes}.joblib
      params:
        - fso_decoding
      outs:
        - ${paths.fso_decoding_dir}/${item.session}_${item.paradigm}_${item.probes}.json

  acorr:
    foreach: ${rec_all}
    do:
      desc: "Compute LLR autocorrelation for sessions"
      cmd: python ${paths.script_dir}/acorr.py --session ${item.session} --paradigm ${item.paradigm} --probes ${item.probes}
      deps:
        - ${paths.script_dir}/acorr.py
        - ${paths.extract_data_dir}/${item.session}_${item.paradigm}_${item.probes}.joblib
        - ${paths.pred_all_units_dir}/${item.session}_${item.paradigm}_${item.probes}.joblib
        - ${paths.pred_shuffle_dir}/${item.session}_${item.paradigm}_${item.probes}.joblib
      params:
        - acorr
      outs:
        - ${paths.acorr_dir}/${item.session}_${item.paradigm}_${item.probes}.joblib
  
  states_loglik:
    foreach: ${rec_plot_it}
    do:
      desc: "Log-likelihood of held-out units given states predicted from disjoint unit subset"
      cmd: python ${paths.script_dir}/states_loglik.py --session ${item.session} --paradigm ${item.paradigm} --probes ${item.probes}
      deps:
        - ${paths.script_dir}/states_loglik.py
        - ${paths.extract_data_dir}/${item.session}_${item.paradigm}_${item.probes}.joblib
      params:
        - model
        - states_loglik
      outs:
        - ${paths.states_loglik_dir}/${item.session}_${item.paradigm}_${item.probes}.json

  marg_loglik:
    foreach: ${rec_plot_it}
    do:
      desc: "Marginal log-likelihood of one-state and two-state (LLR) models on binocular trials"
      cmd: python ${paths.script_dir}/marg_loglik.py --session ${item.session} --paradigm ${item.paradigm} --probes ${item.probes}
      deps:
        - ${paths.script_dir}/marg_loglik.py
        - ${paths.extract_data_dir}/${item.session}_${item.paradigm}_${item.probes}.joblib
      params:
        - model
        - marg_loglik
      outs:
        - ${paths.marg_loglik_dir}/${item.session}_${item.paradigm}_${item.probes}.json

  stats:
    foreach: ${rec_all}
    do:
      desc: "Compute summary statistics for sessions"
      cmd: python ${paths.script_dir}/stats.py --session ${item.session} --paradigm ${item.paradigm} --probes ${item.probes}
      deps:
        - ${paths.script_dir}/stats.py
        - ${paths.extract_data_dir}/${item.session}_${item.paradigm}_${item.probes}.joblib
        - ${paths.pred_all_units_dir}/${item.session}_${item.paradigm}_${item.probes}.joblib
      params:
        - stats
      outs:
        - ${paths.stats_dir}/${item.session}_${item.paradigm}_${item.probes}.json

  summary_stats:
    desc: "Compute summary statistics across all sessions"
    cmd: python ${paths.script_dir}/summary_stats.py
    deps:
      - ${paths.script_dir}/summary_stats.py
      - ${paths.stats_dir}/
      - ${paths.fso_decoding_dir}/
      - ${paths.probe_coherence_dir}/
      - ${paths.states_loglik_dir}/
    metrics:
      - ${paths.summary_stats_dir}/summary_stats.json

  compile_data:
    foreach: ${rec_all}
    do:
      desc: "Combine fields from stages into single MAT file"
      cmd: python ${paths.script_dir}/compile_data.py --session ${item.session} --paradigm ${item.paradigm} --probes ${item.probes}
      deps:
        - ${paths.script_dir}/compile_data.py
        - ${paths.data_dir}/${item.session}/session.h5
        - ${paths.pred_all_units_dir}/${item.session}_${item.paradigm}_${item.probes}.joblib
        - ${paths.pred_random_stim_dir}/${item.session}_${item.paradigm}_${item.probes}.joblib
        - ${paths.pred_unit_subset_dir}/${item.session}_${item.paradigm}_${item.probes}.joblib
      outs:
        - ${paths.compile_data_dir}/${item.session}_${item.paradigm}_${item.probes}.mat
